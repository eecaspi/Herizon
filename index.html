<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
</head>
<body>
<title>HERizon | שיחת היכרות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">
<style>
/* Layout: one centred column (max 980px). Deep-purple "horizon" panel on top, cream page, white cards. */
:root{
  --bg:#FAF6EF; --surface:#FFFFFF; --ink:#2B1745; --muted:#6C5D80; --line:#E7DFF1;
  --brand:#4A2377; --brand-ink:#FFFFFF; --brand-soft:#EEE7F8; --lav:#CDBDEB; --lav-strong:#9C82D1;
  --hero:#34165A; --hero-ink:#FBF7F0; --hero-dim:#CDBDEB;
  --ok:#23704F; --ok-bg:#E3F3EA; --warn:#8F5F0D; --warn-bg:#FBF0D9; --bad:#A4304A; --bad-bg:#FBE4E9;
  --shadow:0 1px 2px rgba(43,23,69,.06),0 8px 28px rgba(43,23,69,.07);
  --font-display:'Frank Ruhl Libre','David Libre',Georgia,serif;
  --font-body:'Assistant','Heebo','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150D22; --surface:#211433; --ink:#F2EBFA; --muted:#B5A6CB; --line:#37264F;
  --brand:#B79CEB; --brand-ink:#1A0F2B; --brand-soft:#2E1F49; --lav:#4B3573; --lav-strong:#B79CEB;
  --hero:#2A1248; --hero-ink:#FBF7F0; --hero-dim:#CDBDEB;
  --ok:#7ED3A8; --ok-bg:#16352A; --warn:#EBC272; --warn-bg:#3A2D12; --bad:#F29AAF; --bad-bg:#3E1822;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#150D22; --surface:#211433; --ink:#F2EBFA; --muted:#B5A6CB; --line:#37264F;
  --brand:#B79CEB; --brand-ink:#1A0F2B; --brand-soft:#2E1F49; --lav:#4B3573; --lav-strong:#B79CEB;
  --hero:#2A1248; --hero-ink:#FBF7F0; --hero-dim:#CDBDEB;
  --ok:#7ED3A8; --ok-bg:#16352A; --warn:#EBC272; --warn-bg:#3A2D12; --bad:#F29AAF; --bad-bg:#3E1822;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-block:20px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lav-strong);outline-offset:2px}
a{color:var(--brand)}
.wordmark{font-family:var(--font-display);letter-spacing:.02em;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wordmark b{font-weight:700}
.wordmark span{font-weight:400}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:30px 26px 74px}
.hero .mark{font-size:20px}
.hero h1{font-size:clamp(30px,6.4vw,46px);margin-top:20px;font-weight:500}
.hero .tag{margin-top:6px;font-family:var(--font-display);font-style:italic;color:var(--hero-dim);direction:ltr;text-align:right;font-size:17px;letter-spacing:.03em}
.hero svg{position:absolute;inset-inline:0;bottom:0;width:100%;height:78px;display:block}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;background:var(--hero-dim);opacity:.55}
.hero .by{position:absolute;top:30px;inset-inline-start:26px;font-size:13px;color:var(--hero-dim)}
.ribbon{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.intro{display:flex;flex-direction:column;gap:10px;font-size:17px}
.intro .lead{font-family:var(--font-display);font-size:22px;color:var(--brand)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:13px 26px;min-height:48px;transition:transform .12s,opacity .12s}
.btn:hover{opacity:.92}.btn:active{transform:scale(.98)}
.btn[disabled],.btn.disabled{opacity:.5;cursor:default;pointer-events:none}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--lav-strong)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.btn.danger{background:var(--bad);color:#fff}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;padding:4px;font-weight:600}
.notice{border-radius:12px;padding:12px 14px;font-size:15px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}

/* picker */
.picker{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px}
.picker h2,.section-title{font-size:20px;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head strong{font-family:var(--font-display);font-size:19px;font-weight:500}
.nav-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.nav-btn[disabled]{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .dow{text-align:center;font-size:13px;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;min-height:42px;border-radius:50%;border:0;background:transparent;color:var(--muted);opacity:.45;font-weight:400;display:grid;place-items:center;position:relative;font-variant-numeric:tabular-nums}
.day.avail{opacity:1;background:var(--brand-soft);color:var(--brand);font-weight:700}
.day.avail:hover{background:var(--lav)}
.day.sel{background:var(--brand);color:var(--brand-ink);opacity:1}
.day.today::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}
.day[disabled]{cursor:default}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.time{min-height:46px;border-radius:12px;border:1.5px solid var(--lav-strong);background:transparent;color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.time:hover,.time.sel{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tz{font-size:13px;color:var(--muted);margin-top:12px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lav-strong);outline:none;box-shadow:0 0 0 3px var(--lav)}
.field .err{color:var(--bad);font-size:14px}
.field .ltr{direction:ltr;text-align:right}
.form{display:flex;flex-direction:column;gap:14px;max-width:460px}
.chosen{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--brand-soft);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.chosen strong{font-family:var(--font-display);font-size:19px;font-weight:500}
.hp{position:absolute;top:0;inset-inline-start:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;clip-path:inset(50%)}

/* done */
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 22px}
.done h2{font-size:clamp(28px,6vw,38px);color:var(--brand)}
.when{background:var(--brand-soft);border-radius:16px;padding:14px 22px}
.when strong{display:block;font-family:var(--font-display);font-size:22px;font-weight:500}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.foot{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;color:var(--muted);font-size:14px;padding:6px 4px}

/* admin */
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;border-radius:999px;padding:9px 18px;font-weight:600;color:var(--muted);min-height:42px}
.tab.on{background:var(--brand);color:var(--brand-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-family:var(--font-display);font-size:34px;font-weight:500;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.toolbar .field{min-width:150px;flex:1 1 150px}
.tbl-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:start;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.ltr{direction:ltr;text-align:right;unicode-bidi:plaintext}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill.scheduled{background:var(--brand-soft);color:var(--brand)}
.pill.completed{background:var(--ok-bg);color:var(--ok)}
.pill.passed{background:var(--ok);color:var(--surface)}
.pill.no_show{background:var(--warn-bg);color:var(--warn)}
.pill.cancelled{background:var(--bad-bg);color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.status-sel{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;min-height:36px}
.notes-row td{background:var(--brand-soft)}
.inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.inline-form .field{flex:1 1 220px}

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk-day{border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.wk-day.today{border-color:var(--lav-strong);box-shadow:0 0 0 2px var(--lav)}
.wk-day h4{margin:0;font-size:14px;font-weight:700}
.wk-day small{color:var(--muted)}
.ev{border-radius:8px;padding:4px 8px;font-size:13px;line-height:1.35;background:var(--brand-soft);color:var(--brand);overflow-wrap:anywhere}
.ev b{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.ev.completed{background:var(--ok-bg);color:var(--ok)}
.ev.passed{background:var(--ok);color:var(--surface)}
.ev.no_show{background:var(--warn-bg);color:var(--warn)}
.day-list{display:flex;flex-direction:column;gap:6px}
.dl{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.dl.open{opacity:.65}.dl.blocked{opacity:.5;background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px)}
.dl b{direction:ltr;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:10px;border:1.5px solid var(--lav-strong);background:var(--brand-soft);color:var(--brand);padding:5px 10px;min-height:34px;font-size:14px;font-weight:600;direction:ltr;font-variant-numeric:tabular-nums}
.chip.blocked{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line) 5px 6px);color:var(--muted);border-style:dashed;border-color:var(--line);text-decoration:line-through}
.chip.booked{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);cursor:default}
.avail-day{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.avail-day header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:600;color:var(--muted);min-height:40px}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;box-shadow:var(--shadow);z-index:20;font-weight:600}
.login{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

@media (max-width:760px){
  .picker{grid-template-columns:1fr;gap:22px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wk{grid-template-columns:1fr}
  .wk-day{min-height:0}
  .hero{padding:24px 20px 70px}
  .hero .by{position:static;margin-top:14px}
  .card{padding:18px}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 4px;background:var(--surface)}
  table.resp td{border:0;display:flex;justify-content:space-between;gap:12px;padding:6px 10px;text-align:end}
  table.resp td::before{content:attr(data-label);color:var(--muted);font-size:13px;font-weight:600;text-align:start;flex:none}
  table.resp tr.notes-row{background:var(--brand-soft)}
  table.resp tr.notes-row td::before{content:none}
  td.ltr{text-align:end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
document.documentElement.lang='he';document.documentElement.dir='rtl';document.body.dir='rtl';
const {useState,useEffect,useMemo,useCallback,useRef}=React;
const html=htm.bind(React.createElement);
const CFG=window.HERIZON_CONFIG||{};
const LIVE=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase);
const TZ='Asia/Jerusalem', SLOT_MS=600000, LEAD_MS=3600000;
const SENDER_ACCOUNT='office@ddosdevs.co.il'; // החשבון שממנו נשלחים המיילים והזימונים
const PUBLIC_URL='https://herizon-program.netlify.app/'; // הכתובת שמופיעה בלינקים שנשלחים למועמדות
const STATUS={scheduled:'נקבע',completed:'התקיים',passed:'עברה את הראיון',no_show:'לא הגיעה',cancelled:'בוטל'};

/* ---------- time helpers (all display in Israel time) ---------- */
const pad=n=>String(n).padStart(2,'0');
const dtfDate=new Intl.DateTimeFormat('he-IL',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'});
const dtfShort=new Intl.DateTimeFormat('he-IL',{timeZone:TZ,weekday:'short',day:'numeric',month:'numeric'});
const dtfTime=new Intl.DateTimeFormat('he-IL',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const dtfKey=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const dtfParts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtDate=iso=>dtfDate.format(new Date(iso));
const fmtTime=iso=>dtfTime.format(new Date(iso));
const dayKey=iso=>dtfKey.format(new Date(iso));
const todayKey=()=>dayKey(new Date().toISOString());
function tzOffset(ms){const p={};dtfParts.formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-Math.floor(ms/1000)*1000;}
function ilToUtc(key,hm){const [y,m,d]=key.split('-').map(Number),[h,mi]=hm.split(':').map(Number);
  const guess=Date.UTC(y,m-1,d,h,mi);const u1=guess-tzOffset(guess);return new Date(guess-tzOffset(u1)).toISOString();}
function addDays(key,n){const [y,m,d]=key.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`;}
const weekday=key=>{const [y,m,d]=key.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay();};
const fmtKey=key=>dtfDate.format(new Date(ilToUtc(key,'12:00')));
const fmtKeyShort=key=>dtfShort.format(new Date(ilToUtc(key,'12:00')));
function rangeSlots(key,from,to){const s=Date.parse(ilToUtc(key,from)),e=Date.parse(ilToUtc(key,to)),out=[];
  for(let t=s;t+SLOT_MS<=e;t+=SLOT_MS)out.push(new Date(t).toISOString());return out;}
const uid=()=>(crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Math.random().toString(16).slice(2)+Date.now();
const nIso=x=>new Date(x).toISOString();
const EMAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
function calLinks(iso,meet){const s=Date.parse(iso),e=s+SLOT_MS,enc=encodeURIComponent;
  const st=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const title='HERizon | שיחת היכרות';
  const det='שיחת היכרות קצרה (10 דקות) לקראת תוכנית HERizon.'+(meet?'\nקישור לשיחה: '+meet:'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HERizon//he','BEGIN:VEVENT','UID:'+uid()+'@herizon','DTSTAMP:'+st(Date.now()),
    'DTSTART:'+st(s),'DTEND:'+st(e),'SUMMARY:'+title,'DESCRIPTION:'+det.replace(/\n/g,'\\n'),meet?'LOCATION:'+meet:'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  return {google:'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+enc(title)+'&dates='+st(s)+'/'+st(e)+'&details='+enc(det)+(meet?'&location='+enc(meet):''),
    outlook:'https://outlook.live.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject='+enc(title)+'&startdt='+enc(new Date(s).toISOString())+'&enddt='+enc(new Date(e).toISOString())+'&body='+enc(det),
    ics:'data:text/calendar;charset=utf-8,'+enc(ics)};}

/* ======================= DATA LAYER ======================= */
/* Demo mode: everything lives in this browser only. Live mode: Supabase (see README). */
const demoApi=(()=>{
  const KEY='herizon-demo-v2';let mem=null;
  const rd=()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return mem;};
  let db=rd();
  const wr=()=>{mem=db;try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}};
  if(!db){db={slots:[],bookings:[],settings:{meet_link:'',admin_notify_email:''},admin:false};
    const t=todayKey();
    for(let i=0;i<21;i++){const k=addDays(t,i),wd=weekday(k);if(wd>=5)continue;
      const rs=(wd===1||wd===3)?[['12:30','13:10'],['20:00','21:00']]:[['20:00','21:00']];
      rs.forEach(([a,b])=>rangeSlots(k,a,b).forEach(iso=>db.slots.push({id:uid(),starts_at:iso,blocked:false})));}
    const fut=db.slots.filter(s=>Date.parse(s.starts_at)>Date.now()+2*LEAD_MS);
    [['נועה (דוגמה)','noa@example.com','050-0000001',2],['מיכל (דוגמה)','michal@example.com','050-0000002',5],['שירה (דוגמה)','shira@example.com','050-0000003',9]].forEach(([n,e,p,i])=>{
      if(fut[i])db.bookings.push({id:uid(),slot_id:fut[i].id,token:uid(),full_name:n,email:e,phone:p,status:'scheduled',notes:'',starts_at:fut[i].starts_at,confirmation_sent_at:null,reminder_sent_at:null,created_at:new Date().toISOString()});});
    wr();}
  const act=()=>db.bookings.filter(b=>b.status!=='cancelled');
  const taken=iso=>act().some(b=>b.starts_at===iso);
  const usable=iso=>{const s=db.slots.find(x=>x.starts_at===iso);return s&&!s.blocked&&Date.parse(iso)>Date.now()+LEAD_MS;};
  const tick=()=>new Promise(r=>setTimeout(r,120));
  return {
    mode:'demo',
    async getOpenSlots(){await tick();return db.slots.filter(s=>!s.blocked&&Date.parse(s.starts_at)>Date.now()+LEAD_MS&&!taken(s.starts_at)).map(s=>s.starts_at).sort();},
    async bookSlot(iso,{name,email,phone}){await tick();
      if(name.trim().length<2||!EMAIL_RE.test(email.trim())||phone.trim().length<7)return {ok:false,error:'invalid'};
      if(!usable(iso)||taken(iso))return {ok:false,error:'unavailable'};
      if(act().some(b=>b.email.toLowerCase()===email.trim().toLowerCase()&&b.status==='scheduled'&&Date.parse(b.starts_at)>Date.now()))return {ok:false,error:'already_booked'};
      const s=db.slots.find(x=>x.starts_at===iso);
      const b={id:uid(),slot_id:s.id,token:uid(),full_name:name.trim(),email:email.trim().toLowerCase(),phone:phone.trim(),status:'scheduled',notes:'',starts_at:iso,confirmation_sent_at:null,reminder_sent_at:null,created_at:new Date().toISOString()};
      db.bookings.push(b);wr();return {ok:true,token:b.token,starts_at:iso,meet_link:db.settings.meet_link||''};},
    async getBooking(token){await tick();const b=db.bookings.find(x=>x.token===token);
      return b?{ok:true,name:b.full_name,starts_at:b.starts_at,status:b.status,meet_link:db.settings.meet_link||''}:{ok:false};},
    async cancelByToken(token){const b=db.bookings.find(x=>x.token===token&&x.status==='scheduled'&&Date.parse(x.starts_at)>Date.now());
      if(!b)return {ok:false};b.status='cancelled';wr();return {ok:true};},
    async rescheduleByToken(token,iso){const b=db.bookings.find(x=>x.token===token&&x.status==='scheduled'&&Date.parse(x.starts_at)>Date.now());
      if(!b)return {ok:false,error:'not_scheduled'};if(!usable(iso)||taken(iso))return {ok:false,error:'unavailable'};
      b.starts_at=iso;b.slot_id=db.slots.find(x=>x.starts_at===iso).id;wr();return {ok:true,starts_at:iso};},
    async notify(){return {ok:false,reason:'demo'};},
    /* admin */
    async session(){return !!db.admin;},
    async login(email,pw){await tick();if(pw==='demo'){db.admin=true;wr();return {ok:true};}return {ok:false,error:'סיסמה שגויה. בהדגמה הסיסמה היא demo'};},
    async logout(){db.admin=false;wr();},
    async listSlots(){return db.slots.map(s=>({...s}));},
    async listBookings(){return db.bookings.map(b=>({...b})).sort((a,b)=>a.starts_at.localeCompare(b.starts_at));},
    async addSlots(isos){let n=0;isos.forEach(iso=>{if(!db.slots.some(s=>s.starts_at===iso)){db.slots.push({id:uid(),starts_at:iso,blocked:false});n++;}});wr();return n;},
    async setBlocked(isos,v){let n=0;db.slots.forEach(s=>{if(isos.includes(s.starts_at)){s.blocked=v;n++;}});wr();return n;},
    async deleteSlots(isos){const before=db.slots.length;db.slots=db.slots.filter(s=>!(isos.includes(s.starts_at)&&!taken(s.starts_at)));wr();return before-db.slots.length;},
    async updateBooking(id,patch){const b=db.bookings.find(x=>x.id===id);
      if(patch.status==='scheduled'&&b.status==='cancelled'&&taken(b.starts_at))return {ok:false,error:'המשבצת כבר תפוסה'};
      Object.assign(b,patch);wr();return {ok:true};},
    async deleteBooking(id){db.bookings=db.bookings.filter(x=>x.id!==id);wr();return {ok:true};},
    async moveBooking(id,iso){const b=db.bookings.find(x=>x.id===id);if(!usable(iso)||act().some(x=>x.starts_at===iso&&x.id!==id))return {ok:false,error:'unavailable'};
      b.starts_at=iso;b.slot_id=db.slots.find(x=>x.starts_at===iso).id;wr();return {ok:true};},
    async sendReminder(){return {ok:false,reason:'demo'};},
    async sendInvite(){return {ok:false,reason:'demo'};},
    async getSettings(){return {...db.settings};},
    async saveSettings(s){db.settings={...db.settings,...s};wr();return {ok:true};},
    resetDemo(){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}
  };})();

const makeLiveApi=()=>{
  const sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  const norm=r=>({...r,starts_at:nIso(r.starts_at)});
  async function all(table,order){let out=[],from=0;for(;;){const {data,error}=await sb.from(table).select('*').order(order).range(from,from+999);
    if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000;}return out;}
  const fn=async(body)=>{try{const {data,error}=await sb.functions.invoke('send-email',{body});
    if(error)return {ok:false,reason:'failed'};return data&&data.ok?{ok:true}:{ok:false,reason:(data&&data.reason)||'failed'};}catch(e){return {ok:false,reason:'failed'};}};
  const adminMail=async(action,id)=>{const {data:s}=await sb.auth.getSession();
    try{const {data,error}=await sb.functions.invoke('send-email',{body:{action,booking_id:id},headers:{Authorization:'Bearer '+s.session.access_token}});
      if(error)return {ok:false,reason:'failed'};return data&&data.ok?{ok:true}:{ok:false,reason:(data&&data.reason)||'failed'};}catch(e){return {ok:false,reason:'failed'};}};
  const rpc=async(name,args)=>{const {data,error}=await sb.rpc(name,args);if(error)throw error;return data;};
  return {
    mode:'live',
    async getOpenSlots(){const d=await rpc('get_open_slots');return d.map(r=>nIso(r.starts_at));},
    async bookSlot(iso,{name,email,phone}){const r=await rpc('book_slot',{p_starts_at:iso,p_name:name,p_email:email,p_phone:phone});if(r.ok)r.starts_at=nIso(r.starts_at);return r;},
    async getBooking(token){const r=await rpc('get_booking_by_token',{p_token:token});if(r.ok)r.starts_at=nIso(r.starts_at);return r;},
    async cancelByToken(token){return rpc('cancel_booking_by_token',{p_token:token});},
    async rescheduleByToken(token,iso){return rpc('reschedule_booking_by_token',{p_token:token,p_new:iso});},
    async notify(token){return fn({action:'confirmation',token});},
    async session(){const {data}=await sb.auth.getSession();if(!data.session)return false;const {data:ok}=await sb.rpc('is_admin');return !!ok;},
    async login(email,pw){const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
      if(error)return {ok:false,error:'אימייל או סיסמה שגויים'};
      const {data:ok}=await sb.rpc('is_admin');if(!ok){await sb.auth.signOut();return {ok:false,error:'למשתמשת הזו אין הרשאת ניהול'};}return {ok:true};},
    async logout(){await sb.auth.signOut();},
    async listSlots(){return (await all('slots','starts_at')).map(norm);},
    async listBookings(){return (await all('bookings','starts_at')).map(norm);},
    async addSlots(isos){return rpc('admin_add_slots',{p_starts:isos});},
    async setBlocked(isos,v){return rpc('admin_set_blocked',{p_starts:isos,p_blocked:v});},
    async deleteSlots(isos){return rpc('admin_delete_slots',{p_starts:isos});},
    async updateBooking(id,patch){const {error}=await sb.from('bookings').update(patch).eq('id',id);
      if(error)return {ok:false,error:error.code==='23505'?'המשבצת כבר תפוסה':error.message};return {ok:true};},
    async deleteBooking(id){const {error}=await sb.from('bookings').delete().eq('id',id);return error?{ok:false,error:error.message}:{ok:true};},
    async moveBooking(id,iso){return rpc('admin_move_booking',{p_id:id,p_new:iso});},
    async sendReminder(id){return adminMail('reminder',id);},
    async sendInvite(id){return adminMail('invite',id);},
    async getSettings(){const {data,error}=await sb.from('settings').select('*');if(error)throw error;const o={};data.forEach(r=>o[r.key]=r.value);return o;},
    async saveSettings(s){const rows=Object.entries(s).map(([key,value])=>({key,value}));const {error}=await sb.from('settings').upsert(rows);return error?{ok:false,error:error.message}:{ok:true};}
  };};

function MonthPicker({days,selected,onSelect}){
  const keys=useMemo(()=>[...days.keys()].sort(),[days]);const first=keys[0],last=keys[keys.length-1];
  const [ym,setYm]=useState((first||todayKey()).slice(0,7));
  useEffect(()=>{if(first&&!selected)setYm(first.slice(0,7));},[first]);
  const [y,m]=ym.split('-').map(Number);
  const dim=new Date(Date.UTC(y,m,0)).getUTCDate(),off=new Date(Date.UTC(y,m-1,1)).getUTCDay();
  const cells=[];for(let i=0;i<off;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(`${y}-${pad(m)}-${pad(d)}`);
  const shift=n=>{const d=new Date(Date.UTC(y,m-1+n,1));setYm(`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}`);};
  const title=new Intl.DateTimeFormat('he-IL',{timeZone:'UTC',month:'long',year:'numeric'}).format(new Date(Date.UTC(y,m-1,15)));
  const canPrev=ym>todayKey().slice(0,7),canNext=last&&ym<last.slice(0,7),today=todayKey();
  return html`<div>
    <div className="cal-head">
      <button className="nav-btn" onClick=${()=>shift(-1)} disabled=${!canPrev} aria-label="החודש הקודם">›</button>
      <strong>${title}</strong>
      <button className="nav-btn" onClick=${()=>shift(1)} disabled=${!canNext} aria-label="החודש הבא">‹</button>
    </div>
    <div className="cal-grid" role="grid">
      ${['א','ב','ג','ד','ה','ו','ש'].map(d=>html`<div key=${d} className="dow">${d}</div>`)}
      ${cells.map((k,i)=>k===null?html`<div key=${'e'+i}/>`:html`<button key=${k} disabled=${!days.has(k)}
        className=${'day'+(days.has(k)?' avail':'')+(selected===k?' sel':'')+(k===today?' today':'')}
        onClick=${()=>onSelect(k)} aria-label=${fmtKey(k)+(days.has(k)?'':' — אין מועדים')}>${+k.slice(8)}</button>`)}
    </div></div>`;}

function SlotPicker({slots,loading,error,onRetry,onPick,pickedIso}){
  const days=useMemo(()=>{const m=new Map();slots.forEach(iso=>{const k=dayKey(iso);if(!m.has(k))m.set(k,[]);m.get(k).push(iso);});return m;},[slots]);
  const [day,setDay]=useState(null);
  const timesRef=useRef(null);
  useEffect(()=>{if(day&&!days.has(day))setDay(null);},[days]);
  if(loading)return html`<div className="empty" role="status">טוענות מועדים פנויים…</div>`;
  if(error)return html`<div className="empty"><p>לא הצלחנו לטעון את המועדים הפנויים.</p><p><button className="link" onClick=${onRetry}>לנסות שוב</button></p></div>`;

  const choose=k=>{setDay(k);setTimeout(()=>{try{if(window.innerWidth<=760&&timesRef.current)timesRef.current.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},60);};
  return html`<div className="picker">
    <div><h2>בחרי תאריך</h2><${MonthPicker} days=${days} selected=${day} onSelect=${choose}/></div>
    <div ref=${timesRef}><h2>${day?fmtKey(day):'בחרי שעה'}</h2>
      ${day?html`<div className="times">${days.get(day).map(iso=>html`<button key=${iso} className=${'time'+(pickedIso===iso?' sel':'')} onClick=${()=>onPick(iso)}>${fmtTime(iso)}</button>`)}</div>`
           :html`<p className="muted">בחרי יום מסומן בלוח כדי לראות את השעות הפנויות.</p>`}
      <p className="tz">השעות מוצגות לפי שעון ישראל · כל שיחה נמשכת 10 דקות</p></div></div>`;}

function useSlots(){

function CalendarTab({slots,bookings}){
  const [view,setView]=useState('week'),[anchor,setAnchor]=useState(todayKey());
  const info=useMemo(()=>{const m=new Map();const get=k=>{if(!m.has(k))m.set(k,{rows:[],open:0});return m.get(k);};
    const bmap=new Map(bookings.filter(b=>b.status!=='cancelled').map(b=>[b.starts_at,b]));
    slots.forEach(s=>{const k=dayKey(s.starts_at),d=get(k),b=bmap.get(s.starts_at);d.rows.push({iso:s.starts_at,blocked:s.blocked,b});if(!b&&!s.blocked)d.open++;});
    bookings.filter(b=>b.status!=='cancelled'&&!slots.some(s=>s.starts_at===b.starts_at)).forEach(b=>get(dayKey(b.starts_at)).rows.push({iso:b.starts_at,b}));
    m.forEach(d=>d.rows.sort((a,b)=>a.iso.localeCompare(b.iso)));return m;},[slots,bookings]);

      <div style=${{display:'flex',gap:8,alignItems:'center'}}>
        <button className="nav-btn" onClick=${()=>setAnchor(addDays(anchor,-step))} aria-label="הקודם">›</button>
        <button className="btn ghost sm" onClick=${()=>setAnchor(today)}>היום</button>
        <button className="nav-btn" onClick=${()=>setAnchor(addDays(anchor,step))} aria-label="הבא">‹</button></div></div>
    <h3 className="section-title">${view==='week'?`${fmtKeyShort(days[0])} – ${fmtKeyShort(days[6])}`:fmtKey(anchor)}</h3>
    ${view==='week'?html`<div className="wk">${days.map(k=>{const d=info.get(k)||{rows:[],open:0};const bs=d.rows.filter(r=>r.b);
      return html`<div key=${k} className=${'wk-day'+(k===today?' today':'')}><h4>${fmtKeyShort(k)}</h4>
        ${bs.map(r=>html`<div key=${r.iso} className=${'ev '+r.b.status}><b>${fmtTime(r.iso)}</b> ${r.b.full_name}</div>`)}
        ${d.open>0&&html`<small>${d.open} משבצות פנויות</small>`}${!bs.length&&!d.open&&html`<small>—</small>`}</div>`;})}</div>`

        :html`<div className="empty">אין משבצות ביום הזה.</div>`}</div>`}</section>`;}

function AvailabilityTab({slots,bookings,reload,toast}){

  const bname=new Map(bookings.filter(b=>b.status!=='cancelled').map(b=>[b.starts_at,b.full_name]));
  async function toggle(s){try{await api.setBlocked([s.starts_at],!s.blocked);await reload();}catch(e){toast('הפעולה נכשלה');}}

function linesToHtml(lines){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>');
  const st='direction:rtl;text-align:right;unicode-bidi:plaintext;margin:0';
  return '<div dir="rtl" style="direction:rtl;text-align:right">'+lines.map(l=>l===''?'<div dir="rtl" style="'+st+'"><br></div>':'<div dir="rtl" style="'+st+'">'+esc(l)+'</div>').join('')+'</div>';}
async function copyRich(html,text){
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);return true;}catch(e){}
  try{const d=document.createElement('div');d.innerHTML=html;d.style.position='fixed';d.style.top='0';d.style.opacity='0';document.body.appendChild(d);const r=document.createRange();r.selectNodeContents(d);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);const ok=document.execCommand('copy');sel.removeAllRanges();d.remove();return ok;}catch(e){return false;}}

function Admin(){

  const reload=useCallback(async()=>{try{const [s,b]=await Promise.all([api.listSlots(),api.listBookings()]);setSlots(s);setBookings(b);setErr('');try{const st=await api.getSettings();setMeet((st.meet_link||'').trim());}catch(e){}}catch(e){setErr('לא הצלחנו לטעון את הנתונים: '+(e.message||''));}},[]);
  useEffect(()=>{api.session().then(ok=>setAuth(ok?'in':'out')).catch(()=>setAuth('out'));},[]);
  useEffect(()=>{if(auth==='in')reload();},[auth,reload]);
  if(auth==='loading')return html`<div className="wrap"><div className="card empty">טוענות…</div></div>`;
  if(auth==='out')return html`<${Login} onIn=${()=>setAuth('in')}/>`;
  const now=Date.now(),active=bookings.filter(b=>b.status!=='cancelled'),taken=new Set(active.map(b=>b.starts_at));
  const openSlots=slots.filter(s=>!s.blocked&&Date.parse(s.starts_at)>now+LEAD_MS&&!taken.has(s.starts_at)).map(s=>s.starts_at).sort();
  const stats=[[active.length,'ראיונות שנקבעו'],[bookings.filter(b=>b.status==='completed'||b.status==='passed').length,'ראיונות שהתקיימו'],[bookings.filter(b=>b.status==='passed').length,'עברו את הראיון'],
    [active.filter(b=>b.status==='scheduled'&&Date.parse(b.starts_at)>now).length,'ראיונות שנותרו'],[openSlots.length,'משבצות פנויות']];
  return html`<div className="wrap">
    <${DemoRibbon}/>
    <div className="top"><div style=${{display:'flex',alignItems:'baseline',gap:10}}><${Wordmark} className="mark"/><h1 style=${{fontSize:24}}>ניהול שיחות היכרות</h1></div>

    ${err&&html`<div className="notice bad" role="alert">${err} <button className="link" onClick=${reload}>נסי שוב</button></div>`}
